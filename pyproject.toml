[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphx"
version = "0.4.0"
description = "TUI-native designer and runner for agentic workflows: graph pipelines with loops, LLM agents, APIs, MCP tools, Python and shell nodes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
    "aiosqlite>=0.20",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
tui = ["textual>=0.80", "grandalf>=0.8", "watchfiles>=0.22"]
mcp = ["mcp>=1.0"]
server = ["fastapi>=0.111", "uvicorn>=0.30", "sse-starlette>=2.1"]
keyring = ["keyring>=25.0"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-textual-snapshot>=1.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
graphx = "graphx.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/graphx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
